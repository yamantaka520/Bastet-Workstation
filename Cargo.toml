[workspace]
members = [
  "apps/desktop/src-tauri",
  "crates/bastet-client",
  "crates/bastet-core",
  "crates/bastet-daemon",
  "crates/bastet-protocol",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/yamantaka520/Bastet-Workstation"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
rusqlite = { version = "0.37", features = ["backup", "bundled"] }
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1", features = ["serde", "v4"] }
