name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m0-baseline:
    name: M0 baseline
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate repository baseline
        run: python scripts/check_m0.py
      - name: Run baseline tests
        run: python -m unittest discover -s tests -v

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build

  rust:
    name: Rust and Tauri (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux Tauri prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev bubblewrap apparmor-profiles
      - name: Load distro bwrap namespace profile on the disposable Linux runner
        if: runner.os == 'Linux'
        # Ubuntu ships this optional profile in apparmor-profiles. It permits
        # bwrap setup capabilities and strips them from executed children.
        # Never disable the global restriction or execute test binaries as root.
        run: |
          test "$(id -u)" -ne 0
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1
          dpkg-query -S /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          sha256sum /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          sudo apparmor_parser -r /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - name: Prepare target-specific daemon sidecar
        run: pnpm prepare:sidecar
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Verify native Linux sandbox controls and cleanup
        id: native_linux_sandbox
        if: runner.os == 'Linux'
        run: cargo test -p bastet-daemon --lib sandbox_linux::native_tests --locked -- --ignored
      - name: Diagnose native Linux sandbox bootstrap failure
        if: failure() && runner.os == 'Linux' && steps.native_linux_sandbox.outcome == 'failure'
        # Read-only diagnostics. Do not disable AppArmor, grant host capabilities,
        # run the fixtures as root, or convert the failed gate into a pass.
        run: |
          uname -r
          dpkg-query -W bubblewrap apparmor
          id
          cat /proc/self/attr/current
          sysctl kernel.apparmor_restrict_unprivileged_userns kernel.unprivileged_userns_clone user.max_user_namespaces || true
          for profile in /etc/apparmor.d/bwrap /etc/apparmor.d/bwrap-userns-restrict /usr/share/apparmor/extra-profiles/bwrap-userns-restrict; do
            if test -f "$profile"; then
              printf '%s\n' "$profile"
              cat "$profile"
            fi
          done
          sudo aa-status --filter.profiles='bwrap|unprivileged_userns' || true
          sudo journalctl -k --since '10 minutes ago' --no-pager --grep='apparmor.*(bwrap|userns|net_admin)' || true
      - name: Build desktop with target-specific daemon sidecar
        run: pnpm tauri build --debug --no-bundle
      - name: Smoke compiled daemon lifecycle and recovery
        run: python scripts/smoke_m1.py
