[package]
name = "bastet-daemon"
description = "Local lifecycle and durable-state authority for Bastet Workstation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
bastet-core = { path = "../bastet-core" }
bastet-local-ipc = { path = "../bastet-local-ipc" }
bastet-adapter-agy = { path = "../bastet-adapter-agy" }
bastet-adapter-codex = { path = "../bastet-adapter-codex" }
bastet-protocol = { path = "../bastet-protocol" }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true
zeroize = "=1.9.0"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust", "vendored"] }

[dev-dependencies]
tempfile.workspace = true
tower.workspace = true
